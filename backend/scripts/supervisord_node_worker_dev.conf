# supervisord.conf
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0755

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock 

[inet_http_server]         ; inet (TCP) server disabled by default
port=*:9001        ; (ip_address:port specifier, *:port for all iface)

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:worker]
user=root
directory=/app
command=/bin/bash -l -c "/code/scripts/run_dev_worker.sh"
logfile=/dev/null
logfile_maxbytes=0
autostart=true
autorestart=true

[program:websocket]
user=root
directory=/app
command=/bin/bash -l -c "/code/scripts/run_dev_websocket_worker.sh"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

