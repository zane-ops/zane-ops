x-internal-envs: &internal-envs
  REDIS_HOST: zane.valkey
  REDIS_PORT: 6379
  API_HOST: zane.api.zaneops.internal:8000
  DJANGO_SECRET_KEY: "django-insecure-^@$$8fc&u2j)4@k+p+bg0ei8sm+@+pwq)hstk$$a*0*7#k54kybx" # default value set in `settings.py`

x-backend-vars: &env-vars
  REDIS_URL: redis://zane.valkey:6379/0
  DB_HOST: zane.db
  DB_PORT: 5432
  CADDY_PROXY_ADMIN_HOST: http://zane.proxy:2019
  TEMPORALIO_SERVER_URL: zane.temporal:7233
  LOKI_HOST: http://zane.loki:3100
  ROOT_DOMAIN: ${ROOT_DOMAIN:-127-0-0-1.sslip.io}
  ZANE_APP_DOMAIN: ${ZANE_APP_DOMAIN:-127-0-0-1.sslip.io}
  # the operator sets `MAXMIND_DB_HOST_PATH` (path of the DB on the host), we mount it at
  # a fixed path in the container and tell django about it.
  MAXMIND_DB_PATH: /code/GeoLite2-Country.mmdb
  ZANE_HTTP_MODE: ${MODE:-http}

services:
  zane-vector:
    image: timberio/vector:0.58.0-alpine
    configs:
      - source: vector.yaml
        target: /etc/vector/vector.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - zane
    environment:
      <<: *internal-envs
      # Vector 0.57+ disabled ${VAR} config interpolation by default (security
      # hardening against env leaking through templated fields) — needed for
      # vector.yaml's ${API_HOST}/${DJANGO_SECRET_KEY}.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    deploy:
      mode: global
      labels:
        zane.role: "log-collector"

  zane-temporal-node-worker:
    image: ghcr.io/zane-ops/app:canary
    command: /bin/bash -l -c "/code/scripts/run_dev_worker.sh"
    volumes:
      - ../backend:/code
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-buildx-store:/root/.docker/buildx
      - docker-data:/root/.docker
    environment:
      <<: *env-vars
      BACKEND_COMPONENT: WORKER
      TEMPORALIO_WORKER_TASK_QUEUE: "node-{{.Node.ID}}"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      labels:
        zane.role: "node-worker"
    networks:
      - zane
  zane-temporal-build-worker:
    image: ghcr.io/zane-ops/app:canary
    command: /bin/bash -l -c "/code/scripts/run_dev_worker.sh"
    volumes:
      - ../backend:/code
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-buildx-store:/root/.docker/buildx
      - docker-data:/root/.docker
    environment:
      <<: *env-vars
      BACKEND_COMPONENT: WORKER
      TEMPORALIO_WORKER_TASK_QUEUE: "build-{{.Node.ID}}"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.build-server==true
      labels:
        zane.role: "build-worker"
    networks:
      - zane
  zane-proxy:
    image: ghcr.io/fredkiss3/caddy-cloudflare:2.11.4-alpine
    command: caddy run  --resume  --config /etc/caddy/config.json
    depends_on:
      - zane-valkey
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      labels:
        zane.role: "proxy"
    # `deploy.labels` above is service-level only (Swarm doesn't copy it down
    # to the container)
    labels:
      zane.logs: "true"
      zane.role: "proxy"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - "2019:2019"
    configs:
      - source: config.json
        target: /etc/caddy/config.json
    volumes:
      # - ./proxy/default-caddy-config.json:/etc/caddy/config.json:ro
      - caddy-config-store:/config
    environment:
      <<: *internal-envs
      CADDY_ADMIN: 0.0.0.0:2019
    networks:
      zane:
        aliases:
          - zane.proxy
  zane-temporal-server:
    image: temporalio/server:1.32.0
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=zane.db
      - SERVICES=history,matching,frontend,worker
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - BIND_ON_IP=0.0.0.0
    volumes:
      - ./temporalio/config/dynamicconfig:/etc/temporal/config/dynamicconfig/
      - ./temporalio/config/config_template.yaml:/etc/temporal/config/config_template.yaml
    networks:
      zane:
        aliases:
          - zane.temporal
    ports:
      - 7233:7233
    depends_on:
      - temporal-admin-tools
    deploy:
      replicas: 1
      labels:
        zane.role: "temporal"
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
  temporal-admin-tools:
    image: temporalio/admin-tools:1.32.0
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=zane.db
      - POSTGRES_SEEDS_CREATE=zane.db
      - SKIP_SCHEMA_SETUP=false
      - SKIP_DB_SETUP=false
      - SERVICES=history,matching,frontend,worker
      - TEMPORAL_HOME=/etc/temporal
      - TEMPORAL_ADDRESS=zane.temporal:7233
      - TEMPORAL_CLI_ADDRESS=zane.temporal:7233
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - BIND_ON_IP=0.0.0.0
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    configs:
      - source: admin-tools-entrypoint.sh
        target: /scripts/setup-postgres.sh
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.zane.main-server==true
    networks:
      - zane
volumes:
  caddy-config-store:
  docker-buildx-store:
  docker-data:

configs:
  config.json:
    file: ./proxy/default-caddy-config.json
  vector.yaml:
    file: ./vector/vector.yaml
  admin-tools-entrypoint.sh:
    file: ./temporalio/admin-tools-entrypoint.sh

networks:
  zane:
    external: true
