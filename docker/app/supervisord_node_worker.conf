# supervisord.conf
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0755

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock 

[inet_http_server]         ; inet (TCP) server disabled by default
port=*:9001        ; (ip_address:port specifier, *:port for all iface)

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:worker]
user=root
directory=/app
command=/bin/bash -l -c "/app/scripts/run_worker.sh"
logfile=/app/logs/worker/stdout
stdout_logfile=/app/logs/worker/stdout
stderr_logfile=/app/logs/worker/stderr
autostart=true
autorestart=true

[program:websocket]
user=root
directory=/app
command=/bin/bash -l -c "/app/scripts/run_websocket_worker.sh"
logfile=/app/logs/websocket/stdout
stdout_logfile=/app/logs/websocket/stdout
stderr_logfile=/app/logs/websocket/stderr
autostart=true
autorestart=true

