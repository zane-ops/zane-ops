x-backend-vars: &env-vars
  ENVIRONMENT: PRODUCTION
  REDIS_HOST: zane.valkey
  REDIS_PORT: 6379
  REDIS_URL: redis://zane.valkey:6379/0
  DB_HOST: zane.pgbouncer
  DB_PORT: 5432
  DB_NAME: zane
  DB_USER: ${ZANE_DB_USER:-zane}
  DB_PASSWORD: ${ZANE_DB_PASSWORD:?ZANE_DB_PASSWORD is required}
  ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN is required}
  ZANE_APP_DOMAIN: ${ZANE_APP_DOMAIN:?ZANE_APP_DOMAIN is required}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  CADDY_PROXY_ADMIN_HOST: http://zane.proxy:2019
  ZANE_APP_DIRECTORY: ${ZANE_APP_DIRECTORY:-/var/www/zaneops}
  TEMPORALIO_SERVER_URL: zane.temporal:7233
  __DANGEROUS_ALLOW_HTTP_SESSION: ${__DANGEROUS_ALLOW_HTTP_SESSION:-false}
  LOKI_HOST: http://zane.loki:3100
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
  # OpenTelemetry tracing is opt-in on production: set OTEL_TRACES_ENABLED=true
  # and deploy the observability stack (see compose.prod-otel.yaml).
  OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  MAX_CONCURRENT_DEPLOYS: ${MAX_CONCURRENT_DEPLOYS:-5}
  ZANE_HTTP_MODE: ${MODE:-https}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  # the operator sets `MAXMIND_DB_HOST_PATH` (path of the DB on the host), we mount it at
  # a fixed path in the container and tell django about it.
  # When unset, `/dev/null` is mounted instead and django disables GeoIP,
  MAXMIND_DB_PATH: /app/GeoLite2-Country.mmdb

x-internal-envs: &internal-envs
  API_HOST: zane.api.zaneops.internal:8000
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  REDIS_HOST: zane.valkey
  REDIS_PORT: 6379

services:
  zane-proxy:
    image: ghcr.io/fredkiss3/caddy-cloudflare:2.11.4-alpine
    command: caddy run --resume  --config /etc/caddy/config.json
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      labels:
        zane.stack: "true"
        zane.role: "proxy"
    # `deploy.labels` above is service-level only (Swarm doesn't copy it down
    # to the container) — duplicated here, so that vector can read the logs \
    # of this service
    labels:
      zane.logs: "true"
      zane.role: "proxy"
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: config.json
        target: /etc/caddy/config.json
    volumes:
      - caddy-config-store:/config
    environment:
      <<: *internal-envs
      CADDY_ADMIN: 0.0.0.0:2019
    networks:
      zane:
        aliases:
          - zane.proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      - zane-valkey
  zane-vector:
    image: timberio/vector:0.58.0-alpine
    configs:
      - source: vector.yaml
        target: /etc/vector/vector.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - zane
    environment:
      <<: *internal-envs
      # Vector 0.57+ disabled ${VAR} config interpolation by default (security
      # hardening against env leaking through templated fields) — needed for
      # vector.yaml's ${API_HOST}/${DJANGO_SECRET_KEY}.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    deploy:
      mode: global
      restart_policy:
        condition: any
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
  zane-temporal-main-worker:
    image: ghcr.io/zane-ops/app:${IMAGE_VERSION:?IMAGE_VERSION is required}
    command: /bin/bash -l -c "/app/scripts/run_worker.sh"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-buildx-store:/root/.docker/buildx
      - docker-data:/root/.docker
    depends_on:
      - zane-db
      - zane-valkey
      - zane-proxy
      - zane-temporal-server
      - zane-loki
    environment:
      <<: *env-vars
      BACKEND_COMPONENT: WORKER
      TEMPORALIO_WORKER_TASK_QUEUE: main-task-queue
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - zane

  zane-temporal-node-worker:
    image: ghcr.io/zane-ops/app:${IMAGE_VERSION:?IMAGE_VERSION is required}
    command: /bin/bash -l -c "/app/scripts/run_worker.sh"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-data:/root/.docker
    depends_on:
      - zane-db
      - zane-valkey
      - zane-proxy
      - zane-temporal-server
      - zane-loki
    environment:
      <<: *env-vars
      BACKEND_COMPONENT: WORKER
      TEMPORALIO_WORKER_TASK_QUEUE: "node-{{.Node.Hostname}}"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - zane

  zane-temporal-build-worker:
    image: ghcr.io/zane-ops/app:${IMAGE_VERSION:?IMAGE_VERSION is required}
    command: /bin/bash -l -c "/app/scripts/run_worker.sh"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-buildx-store:/root/.docker/buildx
      - docker-data:/root/.docker
    depends_on:
      - zane-db
      - zane-valkey
      - zane-proxy
      - zane-temporal-server
      - zane-loki
    environment:
      <<: *env-vars
      BACKEND_COMPONENT: WORKER
      TEMPORALIO_WORKER_TASK_QUEUE: "build-{{.Node.Hostname}}"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.build-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - zane

  zane-app:
    image: ghcr.io/zane-ops/app:${IMAGE_VERSION:?IMAGE_VERSION is required}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "2"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/api/ping"]
      interval: 30s
      timeout: 1m30s
      start_period: 5s
      retries: 10
    networks:
      zane:
        aliases:
          - zane.api
          - zane.api.zaneops.internal
          - zane.frontend
          - zane.front.zaneops.internal
    environment:
      <<: *env-vars
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-buildx-store:/root/.docker/buildx
      - docker-data:/root/.docker
      - ${ZANE_APP_DIRECTORY:-/var/www/zaneops}/.env:/app/.env
      # GeoLite IP DB, optional : `/dev/null` when unset, so the mount is always valid
      - ${MAXMIND_DB_HOST_PATH:-/dev/null}:/app/GeoLite2-Country.mmdb
    depends_on:
      - zane-db
      - zane-valkey
      - zane-proxy
      - zane-temporal-server
      - zane-loki
  zane-temporal-server:
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${ZANE_DB_USER:-zane}
      - POSTGRES_PWD=${ZANE_DB_PASSWORD:?ZANE_DB_PASSWORD is required}
      - POSTGRES_SEEDS=zane.db
      - SERVICES=history,matching,frontend,worker
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/production-sql.yaml
    image: temporalio/server:1.32.0
    configs:
      - source: production-sql.yaml
        target: /etc/temporal/config/dynamicconfig/production-sql.yaml
      - source: config_template.yaml
        target: /etc/temporal/config/config_template.yaml
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
        zane.role: "temporal"
      resources:
        limits:
          cpus: "0.5"
          memory: 500M
    networks:
      zane:
        aliases:
          - zane.temporal
    depends_on:
      - zane-db
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
  zane-temporal-admin-tools:
    image: temporalio/admin-tools:1.32.0
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${ZANE_DB_USER:-zane}
      - POSTGRES_PWD=${ZANE_DB_PASSWORD:?ZANE_DB_PASSWORD is required}
      - POSTGRES_SEEDS=zane.pgbouncer
      - POSTGRES_SEEDS_CREATE=zane.db
      - SKIP_SCHEMA_SETUP=false
      - SKIP_DB_SETUP=false
      - SERVICES=history,matching,frontend,worker
      - TEMPORAL_HOME=/etc/temporal
      - TEMPORAL_ADDRESS=zane.temporal:7233
      - TEMPORAL_CLI_ADDRESS=zane.temporal:7233
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production-sql.yaml
      - BIND_ON_IP=0.0.0.0
    configs:
      - source: production-sql.yaml
        target: /etc/temporal/config/dynamicconfig/production-sql.yaml
      - source: config_template.yaml
        target: /etc/temporal/config/config_template.yaml
      - source: admin-tools-entrypoint.sh
        target: /scripts/setup-postgres.sh
        mode: 0555
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "0.5"
          memory: 500M
    networks:
      - zane
  zane-valkey:
    image: valkey/valkey:7.2.5-alpine
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "0.5"
          memory: 500M
    networks:
      zane:
        aliases:
          - zane.valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 2s
  zane-db:
    image: postgres:16-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${ZANE_DB_USER:-zane}
      POSTGRES_PASSWORD: ${ZANE_DB_PASSWORD:?ZANE_DB_PASSWORD is required}
      POSTGRES_DB: zane
    networks:
      zane:
        aliases:
          - zane.db
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "1"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
  zane-pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      <<: *env-vars
      DB_HOST: zane.db
      POOL_MODE: transaction
      MAX_DB_CONNECTIONS: 100
      DEFAULT_POOL_SIZE: 50
      AUTH_TYPE: scram-sha-256
    depends_on:
      - zane-db
    networks:
      zane:
        aliases:
          - zane.pgbouncer
    configs:
      - source: pgbouncer-entrypoint.sh
        target: /entrypoint.sh
        mode: 0555
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "1"
          memory: 1G
  zane-loki:
    image: grafana/loki:3.4
    volumes:
      - loki-data:/loki
    configs:
      - source: loki-config.yaml
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    networks:
      zane:
        aliases:
          - zane.loki
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.zane.main-server==true
      labels:
        zane.stack: "true"
      resources:
        limits:
          cpus: "1"
          memory: 1G
    healthcheck:
      test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1
      start_period: 20s
      interval: 10s
      timeout: 1s
      retries: 12 # try for 2 minutes

configs:
  config.json:
    file: ./proxy/default-caddy-config.json
  vector.yaml:
    file: ./vector/vector.yaml
  production-sql.yaml:
    file: ./temporalio/config/dynamicconfig/production-sql.yaml
  config_template.yaml:
    file: ./temporalio/config/config_template.yaml
  admin-tools-entrypoint.sh:
    file: ./temporalio/admin-tools-entrypoint.sh
  pgbouncer-entrypoint.sh:
    file: ./pgbouncer/entrypoint.sh
  loki-config.yaml:
    file: ./loki/config.yaml

volumes:
  loki-data:
    labels:
      zane.stack: "true"
  docker-buildx-store:
    labels:
      zane.stack: "true"
  docker-data:
    labels:
      zane.stack: "true"
  db-data:
    labels:
      zane.stack: "true"
  redis-data:
    labels:
      zane.stack: "true"
  caddy-config-store:
    labels:
      zane.stack: "true"
networks:
  zane:
    external: true
