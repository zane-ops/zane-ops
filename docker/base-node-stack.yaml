x-backend-vars: &env-vars
  ENVIRONMENT: PRODUCTION
  REDIS_URL: redis://zane.valkey:6379/0
  DB_HOST: zane.pgbouncer
  DB_PORT: 5432
  DB_NAME: zane
  DB_USER: ${ZANE_DB_USER:-zane}
  DB_PASSWORD: ${ZANE_DB_PASSWORD}
  ROOT_DOMAIN: ${ROOT_DOMAIN}
  ZANE_APP_DOMAIN: ${ZANE_APP_DOMAIN}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  CADDY_PROXY_ADMIN_HOST: http://zane.proxy:2019
  ZANE_FLUENTD_HOST: unix://${ZANE_APP_DIRECTORY:-/var/www/zaneops}/.fluentd/fluentd.sock
  TEMPORALIO_SERVER_URL: zane.temporal:7233
  __DANGEROUS_ALLOW_HTTP_SESSION: ${__DANGEROUS_ALLOW_HTTP_SESSION:-false}
  LOKI_HOST: http://zane.loki:3100
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
  # OpenTelemetry tracing is opt-in on production: set OTEL_TRACES_ENABLED=true
  # and deploy the observability stack (see docker-stack.prod-otel.yaml).
  OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  MAX_CONCURRENT_DEPLOYS: ${MAX_CONCURRENT_DEPLOYS:-5}
  ZANE_HTTP_MODE: ${MODE:-https}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  # the operator sets `MAXMIND_DB_HOST_PATH` (path of the DB on the host), we mount it at
  # a fixed path in the container and tell django about it.
  # When unset, `/dev/null` is mounted instead and django disables GeoIP,
  MAXMIND_DB_PATH: /app/GeoLite2-Country.mmdb
  

services:
  proxy:
    image: ghcr.io/fredkiss3/caddy-cloudflare:2.11.4-alpine
    command: caddy run  --resume  --config /etc/caddy/config.json 
    logging:
      driver: "fluentd"
      options:
        mode: "non-blocking"
        fluentd-address: "unix://$HOME/.fluentd/fluentd.sock"
        fluentd-async: "true"
        fluentd-max-retries: 10
        fluentd-sub-second-precision: "true"
        tag: '{"service_id":"zane.proxy"}'
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      placement:
        constraints:
          - node.labels.zane.app-server == true
      restart_policy:
        condition: any
      labels:
        zane.role: "proxy"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ./proxy/default-caddy-config.json:/etc/caddy/config.json:ro
      - config-storage:/config
    environment:
      <<: *internal-envs
      CADDY_ADMIN: 0.0.0.0:2019
    networks:
      zane:
        aliases:
          - zane.proxy
  
    # TODO: Add temporal `node` (schedule) worker
volumes:
  config-storage:

networks:
  zane:
    external: true
